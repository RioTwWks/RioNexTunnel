name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure_vpn_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run app tests
        run: flutter test

      - name: Install v2ray_box dependencies
        working-directory: packages/v2ray_box
        run: flutter pub get

      - name: Run v2ray_box tests
        working-directory: packages/v2ray_box
        run: flutter test

  linux-security-probe:
    name: Linux SOCKS security probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install probe dependencies
        run: sudo apt-get update && sudo apt-get install -y curl openssl

      - name: Fetch xray core for Linux
        run: ./scripts/fetch_cores.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run security_probe against authenticated SOCKS
        run: chmod +x scripts/ci_security_probe_linux.sh scripts/security_probe.sh && ./scripts/ci_security_probe_linux.sh

  windows-build:
    name: Windows desktop build (manual gate)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: secure_vpn_client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install app dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

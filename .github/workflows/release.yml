name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

env:
  APP_DIR: secure_vpn_client
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure_vpn_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run app tests
        run: flutter test

      - name: Install v2ray_box dependencies
        working-directory: packages/v2ray_box
        run: flutter pub get

      - name: Run v2ray_box tests
        working-directory: packages/v2ray_box
        run: flutter test

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Linux release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux bundle
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT="RioNexTunnel-${VERSION}-linux-x64.tar.gz"
          tar -czf "${ARTIFACT}" -C "${APP_DIR}/build/linux/x64/release/bundle" .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
          $artifact = "RioNexTunnel-$version-windows-x64.zip"
          $source = Join-Path "${{ env.APP_DIR }}" "build/windows/x64/runner/Release"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $artifact -Force
          "ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build macOS release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package macOS app
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          MACOS_ARCH="$(uname -m)"
          ARTIFACT="RioNexTunnel-${VERSION}-macos-${MACOS_ARCH}.zip"
          RELEASE_DIR="${APP_DIR}/build/macos/Build/Products/Release"
          APP_PATH="$(find "${RELEASE_DIR}" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app bundle found in ${RELEASE_DIR}"
            ls -la "${RELEASE_DIR}" || true
            exit 1
          fi
          echo "Packaging ${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Android APKs
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Package Android APKs
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT="RioNexTunnel-${VERSION}-android-apks.zip"
          APK_DIR="${APP_DIR}/build/app/outputs/flutter-apk"
          zip -j "${ARTIFACT}" "${APK_DIR}"/*-release.apk
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true

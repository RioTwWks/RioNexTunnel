name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

env:
  APP_DIR: secure_vpn_client
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GITHUB_TOKEN: ${{ github.token }}
  # Pin core versions in CI for reproducible builds and fewer GitHub API calls.
  XRAY_VERSION: "26.3.27"
  SINGBOX_VERSION: "1.14.0"

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure_vpn_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run app tests
        run: flutter test

      - name: Install v2ray_box dependencies
        working-directory: packages/v2ray_box
        run: flutter pub get

      - name: Run v2ray_box tests
        working-directory: packages/v2ray_box
        run: flutter test

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Linux release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux bundle
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT="RioNexTunnel-${VERSION}-linux-x64.tar.gz"
          tar -czf "${ARTIFACT}" -C "${APP_DIR}/build/linux/x64/release/bundle" .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
          $artifact = "RioNexTunnel-$version-windows-x64.zip"
          $source = Join-Path "${{ env.APP_DIR }}" "build/windows/x64/runner/Release"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $artifact -Force
          "ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build macOS release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package macOS app
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          MACOS_ARCH="$(uname -m)"
          ARTIFACT="RioNexTunnel-${VERSION}-macos-${MACOS_ARCH}.zip"
          RELEASE_DIR="${APP_DIR}/build/macos/Build/Products/Release"
          APP_PATH="$(find "${RELEASE_DIR}" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app bundle found in ${RELEASE_DIR}"
            ls -la "${RELEASE_DIR}" || true
            exit 1
          fi
          echo "Packaging ${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./scripts/setup-android-signing.sh

      - name: Build Android APKs and App Bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Package Android artifacts
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT="RioNexTunnel-${VERSION}-android.zip"
          APK_DIR="${APP_DIR}/build/app/outputs/flutter-apk"
          AAB_PATH="${APP_DIR}/build/app/outputs/bundle/release/app-release.aab"
          zip -j "${ARTIFACT}" "${APK_DIR}"/*-release.apk
          if [[ -f "${AAB_PATH}" ]]; then
            zip -j "${ARTIFACT}" "${AAB_PATH}"
          fi
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  build-ios:
    name: Build iOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Setup iOS signing
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: ./scripts/setup-ios-signing.sh

      - name: Build Flutter (iOS)
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          if [[ -f ios/ExportOptions.plist ]]; then
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          else
            flutter build ios --release --no-codesign
          fi

      - name: Package iOS artifact
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if compgen -G "${APP_DIR}/build/ios/ipa/"'*.ipa' > /dev/null; then
            ARTIFACT="RioNexTunnel-${VERSION}-ios.ipa"
            cp "${APP_DIR}"/build/ios/ipa/*.ipa "${ARTIFACT}"
          else
            ARTIFACT="RioNexTunnel-${VERSION}-ios-unsigned.zip"
            APP_PATH="$(find "${APP_DIR}/build/ios/iphoneos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
            if [[ -z "${APP_PATH}" ]]; then
              echo "No iOS .app or .ipa found after build" >&2
              exit 1
            fi
            ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ARTIFACT}"
          fi
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    needs:
      - test
      - build-linux
      - build-windows
      - build-macos
      - build-android
      - build-ios
    if: ${{ always() && !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-x64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-x64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-ARM64
          path: release-assets

      - name: Download macOS artifact (Intel runner fallback)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-X64
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: release-assets

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios
          path: release-assets

      - name: Summarize platform build results
        id: summary
        shell: bash
        run: |
          echo "## Release build matrix" >> "${GITHUB_STEP_SUMMARY}"
          printf '| Platform | Result |\n|----------|--------|\n' >> "${GITHUB_STEP_SUMMARY}"
          printf '| Linux | %s |\n' "${{ needs.build-linux.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| Windows | %s |\n' "${{ needs.build-windows.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| macOS | %s |\n' "${{ needs.build-macos.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| Android | %s |\n' "${{ needs.build-android.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| iOS | %s |\n' "${{ needs.build-ios.result }}" >> "${GITHUB_STEP_SUMMARY}"

          shopt -s nullglob
          files=(release-assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "has_assets=false" >> "${GITHUB_OUTPUT}"
            echo "No platform artifacts were uploaded; nothing to attach to the release." >&2
            exit 1
          fi

          echo "has_assets=true" >> "${GITHUB_OUTPUT}"
          echo "Uploading ${#files[@]} artifact(s):"
          ls -la release-assets/

      - name: Upload assets to GitHub Release
        if: steps.summary.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: false

      - name: Fail workflow when any platform build failed
        if: >-
          contains(fromJSON('["failure","cancelled"]'), needs.build-linux.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.build-windows.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.build-macos.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.build-android.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.build-ios.result)
        run: |
          echo "Published available artifacts, but one or more platform builds failed:" >&2
          echo "  linux:   ${{ needs.build-linux.result }}" >&2
          echo "  windows: ${{ needs.build-windows.result }}" >&2
          echo "  macos:   ${{ needs.build-macos.result }}" >&2
          echo "  android: ${{ needs.build-android.result }}" >&2
          echo "  ios:     ${{ needs.build-ios.result }}" >&2
          exit 1

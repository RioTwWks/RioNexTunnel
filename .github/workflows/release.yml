name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

env:
  APP_DIR: secure_vpn_client
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GITHUB_TOKEN: ${{ github.token }}
  # Pin core versions in CI for reproducible builds and fewer GitHub API calls.
  XRAY_VERSION: "26.3.27"
  SINGBOX_VERSION: "1.14.0"

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure_vpn_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run app tests
        run: flutter test

      - name: Install v2ray_box dependencies
        working-directory: packages/v2ray_box
        run: flutter pub get

      - name: Run v2ray_box tests
        working-directory: packages/v2ray_box
        run: flutter test

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Linux release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./scripts/package-release.sh linux "${VERSION}" dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
          ./scripts/package-release.ps1 -Version $version -OutputDir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Build macOS release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./scripts/package-release.sh macos "${VERSION}" dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./scripts/setup-android-signing.sh

      - name: Build Android APKs and App Bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./scripts/build-android-release.sh

      - name: Package
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./scripts/package-release.sh android "${VERSION}" dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  build-ios:
    name: Build iOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core binaries
        shell: bash
        run: ./scripts/fetch_cores.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Build Libbox.xcframework
        shell: bash
        run: ./scripts/build_libbox_ios.sh

      - name: Setup iOS signing
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: ./scripts/setup-ios-signing.sh

      - name: Build Flutter (iOS)
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          if [[ -f ios/ExportOptions.plist ]]; then
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          else
            flutter build ios --release --no-codesign
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./scripts/package-release.sh ios "${VERSION}" dist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    needs:
      - test
      - build-linux
      - build-windows
      - build-macos
      - build-android
      - build-ios
    if: ${{ always() && !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Summarize platform build results
        id: summary
        shell: bash
        run: |
          echo "## Release build matrix" >> "${GITHUB_STEP_SUMMARY}"
          printf '| Platform | Result |\n|----------|--------|\n' >> "${GITHUB_STEP_SUMMARY}"
          printf '| Linux | %s |\n' "${{ needs.build-linux.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| Windows | %s |\n' "${{ needs.build-windows.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| macOS | %s |\n' "${{ needs.build-macos.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| Android | %s |\n' "${{ needs.build-android.result }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| iOS | %s |\n' "${{ needs.build-ios.result }}" >> "${GITHUB_STEP_SUMMARY}"

          shopt -s nullglob
          files=(dist/*)
          if (( ${#files[@]} == 0 )); then
            echo "has_assets=false" >> "${GITHUB_OUTPUT}"
            echo "No platform artifacts were uploaded; nothing to attach to the release." >&2
            exit 1
          fi

          echo "has_assets=true" >> "${GITHUB_OUTPUT}"
          echo "Uploading ${#files[@]} artifact(s):"
          ls -la dist/

          failed_platforms=()
          [[ "${{ needs.build-linux.result }}" == "failure" || "${{ needs.build-linux.result }}" == "cancelled" ]] && failed_platforms+=("linux")
          [[ "${{ needs.build-windows.result }}" == "failure" || "${{ needs.build-windows.result }}" == "cancelled" ]] && failed_platforms+=("windows")
          [[ "${{ needs.build-macos.result }}" == "failure" || "${{ needs.build-macos.result }}" == "cancelled" ]] && failed_platforms+=("macos")
          [[ "${{ needs.build-android.result }}" == "failure" || "${{ needs.build-android.result }}" == "cancelled" ]] && failed_platforms+=("android")
          [[ "${{ needs.build-ios.result }}" == "failure" || "${{ needs.build-ios.result }}" == "cancelled" ]] && failed_platforms+=("ios")

          if (( ${#failed_platforms[@]} > 0 )); then
            joined="$(IFS=', '; echo "${failed_platforms[*]}")"
            echo "partial_release=true" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Partial release published::Attached available artifacts; failed platforms: ${joined}" >> "${GITHUB_STEP_SUMMARY}"
            echo "Partial release: published available artifacts; failed platforms: ${joined}" >&2
          else
            echo "partial_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload assets to GitHub Release
        if: steps.summary.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/**
          fail_on_unmatched_files: false
